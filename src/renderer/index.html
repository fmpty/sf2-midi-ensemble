<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; media-src *;" />
    <title>SF2 MIDI Ensemble · 多手柄合奏器</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <script>
        (function () {
            var w = window.innerWidth, h = window.innerHeight;
            var tier = w < 600 ? 'phone' : w < 1024 ? 'tablet' : 'desktop';
            document.documentElement.dataset.layout = tier;
            document.documentElement.dataset.orient = h >= w ? 'portrait' : 'landscape';
        })();
    </script>
    <div id="start-overlay" class="overlay">
        <div class="overlay-box">
            <div class="overlay-logo">♫</div>
            <h1>SF2 MIDI Ensemble</h1>
            <p class="overlay-sub">内置 SoundFont 音源 · 多只 MIDI 手柄同时演奏多个乐器</p>
            <button id="btn-start" class="primary">启动音频引擎</button>
            <p class="tip">浏览器策略要求由用户手势启动音频。启动后会自动载入内置音源并扫描 MIDI 设备。</p>
        </div>
    </div>

    <header class="topbar">
        <div class="brand">
            <span class="logo">♫</span>
            <span class="brand-name">SF2 MIDI Ensemble</span>
            <span id="app-version" class="version"></span>
        </div>
        <div class="top-controls">
            <div class="top-stats">
                <span>采样率 <b id="stat-rate">-</b></span>
                <span>延迟 <b id="stat-latency">-</b></span>
                <span>发声 <b id="stat-voices">0</b></span>
            </div>
            <span class="status"><i id="audio-dot" class="dot dot-off"></i><span id="status-audio" class="warn">未启动</span></span>
            <button id="btn-panic" class="mini danger">全部停音</button>
        </div>
    </header>

    <nav class="tabs" id="tabs">
        <button class="tab active" data-tab="play"><span class="ico">🎹</span><span class="txt">演奏</span></button>
        <button class="tab" data-tab="devices"><span class="ico">🎛</span><span class="txt">手柄</span><i id="dev-count" class="badge"></i></button>
        <button class="tab" data-tab="sound"><span class="ico">📦</span><span class="txt">音源</span></button>
        <button class="tab" data-tab="more"><span class="ico">⚙️</span><span class="txt">设置</span></button>
    </nav>

    <main>
        <section id="pane-play" class="tab-pane active">
            <div class="piano-wrap">
                <div id="piano" class="piano"></div>
            </div>
            <div class="play-bar bottom">
                <label class="slider grow">主音量
                    <input id="master-volume" type="range" min="0" max="1.5" step="0.01" value="0.9" />
                    <span id="master-volume-val" class="val">90</span>
                </label>
                <div class="octave-ctrl">
                    <button type="button" id="btn-oct-down" class="mini">八度 −</button>
                    <button type="button" id="btn-oct-up" class="mini">八度 +</button>
                </div>
            </div>
        </section>

        <section id="pane-devices" class="tab-pane">
            <div id="device-list" class="device-list"></div>
            <div class="device-foot">
                <button id="btn-rescan" type="button" class="primary scan-btn">刷新手柄列表</button>
                <p class="hint">先在系统蓝牙中配对名称含 MIDI 的手柄，保持已连接后再点刷新。</p>
            </div>
        </section>

        <section id="pane-sound" class="tab-pane">
            <div class="pane-head">
                <h2>音源（SF2 / SF3 / DLS）</h2>
                <button id="btn-load-bank" class="mini">载入音源</button>
            </div>
            <p class="hint">点「载入音源」选择 .sf2 / .sf3 / .dls；桌面端也可拖拽到窗口。排在上方者优先匹配。</p>
            <div id="bank-list" class="bank-list"></div>
            <p id="bank-count" class="hint"></p>
        </section>

        <section id="pane-more" class="tab-pane">
            <div class="panel">
                <div class="row"><label>复音上限</label>
                    <input id="voice-cap" type="range" min="32" max="128" step="8" value="96" />
                    <span id="voice-cap-val" class="val">96</span>
                </div>
                <div class="row row-toggles">
                    <label class="chk"><input id="low-latency" type="checkbox" checked />低延迟缓冲</label>
                    <label class="chk"><input id="kbd-toggle" type="checkbox" checked />电脑键盘虚拟手柄</label>
                </div>
                <div class="row row-toggles">
                    <button id="btn-reset" class="mini">复位合成器</button>
                </div>
            </div>
            <div class="panel grow">
                <h2>日志</h2>
                <div id="log" class="log"></div>
            </div>
        </section>
    </main>

    <script type="module" src="dist/boot.js"></script>
</body>
</html>
